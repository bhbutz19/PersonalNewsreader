services:
  - type: cron
    name: personal-newsreader-ingest
    runtime: python
    region: virginia
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -u run_collectors.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_LOOKBACK_DAYS
        value: "7"
