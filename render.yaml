services:
  - type: cron
    name: personal-newsreader-ingest
    runtime: python
    region: virginia
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python ingest.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
